<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Outer Dark Blue/Slate Rim Gradient -->
    <linearGradient id="outerRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A4D62" />
      <stop offset="35%" stop-color="#28384A" />
      <stop offset="70%" stop-color="#1E2A38" />
      <stop offset="100%" stop-color="#151E28" />
    </linearGradient>

    <!-- Pearl 3D Convex Dome Radial Gradient -->
    <radialGradient id="pearlConvexDome" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FBFDFE" />
      <stop offset="75%" stop-color="#F1F4F9" />
      <stop offset="90%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </radialGradient>

    <!-- Curved Gloss Specular Crescent Shine -->
    <linearGradient id="specularCurveGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.60" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- MAK Chiseled Metallic Face Gradient -->
    <linearGradient id="makFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3C4F63" />
      <stop offset="48%" stop-color="#293A4C" />
      <stop offset="52%" stop-color="#202D3C" />
      <stop offset="100%" stop-color="#17222E" />
    </linearGradient>

    <!-- DPL 3D Metallic Gold Gradient -->
    <linearGradient id="goldDPL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="35%" stop-color="#D97706" />
      <stop offset="70%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#853606" />
    </linearGradient>

    <!-- Overall Medallion Drop Shadow -->
    <filter id="medallion3DShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>

    <!-- 3D Bevel Letter Shadow -->
    <filter id="chiseledShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0A1017" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- ==================== 1. OUTER BEZEL ==================== -->
  <g filter="url(#medallion3DShadow)">
    <!-- Outer Dark Navy/Slate Bezel Ring -->
    <circle cx="300" cy="300" r="285" fill="url(#outerRim)" stroke="#16222E" stroke-width="3" />
    <!-- Bezel Inner Specular Line -->
    <circle cx="300" cy="300" r="279" fill="none" stroke="#52687F" stroke-width="2" opacity="0.65" />
  </g>

  <!-- ==================== 2. PEARL CONVEX DOME DISC ==================== -->
  <circle cx="300" cy="300" r="258" fill="url(#pearlConvexDome)" stroke="#D0DAE5" stroke-width="2" />
  <circle cx="300" cy="300" r="255" fill="none" stroke="#B8C5D4" stroke-width="3.5" opacity="0.75" />
  <circle cx="300" cy="300" r="252" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.9" />

  <!-- ==================== 3. 3D GLOSS SPECULAR HIGHLIGHT (TOP-RIGHT) ==================== -->
  <path d="M 335,52 C 450,72 535,155 550,275 C 545,190 475,95 350,60 Z" fill="url(#specularCurveGlow)" />
  <ellipse cx="400" cy="90" rx="65" ry="20" transform="rotate(32 400 90)" fill="#FFFFFF" opacity="0.45" />

  <!-- ==================== 4. MAK CHISELED 3D BRAND TYPOGRAPHY ==================== -->
  <g transform="translate(300, 248)" filter="url(#chiseledShadow)">
    <!-- Letter M -->
    <path d="M -192,58 L -192,-88 L -138,-88 L -104,-10 L -70,-88 L -16,-88 L -16,58 L -52,58 L -52,-20 L -86,58 L -122,58 L -156,-20 L -156,58 Z"
          fill="url(#makFace)" stroke="#16222E" stroke-width="1.8" stroke-linejoin="round" />
    <path d="M -192,58 L -192,-88 L -186,-88 L -186,58 Z" fill="#5A7188" opacity="0.65" />
    <path d="M -192,-88 L -138,-88 L -140,-82 L -186,-82 Z" fill="#6B829A" opacity="0.6" />

    <!-- Letter A (Connects to M and K) -->
    <path d="M -6,58 L 36,-88 L 82,-88 L 124,58 L 86,58 L 75,22 L 45,22 L 34,58 Z M 54,-16 L 66,-16 L 60,-52 Z"
          fill="url(#makFace)" stroke="#16222E" stroke-width="1.8" stroke-linejoin="round" />
    <path d="M -6,58 L 36,-88 L 42,-88 L 0,58 Z" fill="#5A7188" opacity="0.65" />

    <!-- Letter K -->
    <path d="M 136,58 L 136,-88 L 178,-88 L 178,-12 L 235,-88 L 290,-88 L 220,-5 L 292,58 L 238,58 L 190,10 L 178,24 L 178,58 Z"
          fill="url(#makFace)" stroke="#16222E" stroke-width="1.8" stroke-linejoin="round" />
    <path d="M 136,58 L 136,-88 L 142,-88 L 142,58 Z" fill="#5A7188" opacity="0.65" />
  </g>

  <!-- ==================== 5. HORIZONTAL DIVIDER RULE ==================== -->
  <rect x="108" y="326" width="384" height="4.5" rx="2.25" fill="#202E3D" />
  <rect x="108" y="330.5" width="384" height="1.5" fill="#FFFFFF" opacity="0.85" />

  <!-- ==================== 6. "GROUP OF COMPANIES" SUBTITLE ==================== -->
  <text x="300" y="358" text-anchor="middle" fill="#182430" font-size="21.5" font-weight="900" letter-spacing="6" font-family="'Segoe UI', Roboto, 'Arial Black', system-ui, sans-serif">
    GROUP OF COMPANIES
  </text>

  <!-- ==================== 7. THE 4 BRAND MARKS ROW ==================== -->

  <!-- 1. DPL (Doora Pvt Ltd) -->
  <g transform="translate(142, 412)">
    <g transform="translate(0, -9)">
      <path d="M -30,18 L -30,-12 L -18,-12 C -10,-12 -6,-8 -6,-2 C -6,4 -10,9 -18,9 L -24,9 L -24,18 Z M -24,3 L -18,3 C -13,3 -12,2 -12,-2 C -12,-5 -13,-6 -18,-6 L -24,-6 Z" fill="url(#goldDPL)" stroke="#78350F" stroke-width="0.8" />
      <path d="M -3,18 L -3,-12 L 9,-12 C 17,-12 21,-8 21,-2 C 21,4 17,9 9,9 L 3,9 L 3,18 Z M 3,3 L 9,3 C 14,3 15,2 15,-2 C 15,-5 14,-6 9,-6 L 3,-6 Z" fill="url(#goldDPL)" stroke="#78350F" stroke-width="0.8" />
      <path d="M 24,18 L 24,-12 L 30,-12 L 30,12 L 39,12 L 39,18 Z" fill="url(#goldDPL)" stroke="#78350F" stroke-width="0.8" />
    </g>
    <text x="5" y="26" text-anchor="middle" fill="#1A2530" font-size="9.5" font-weight="800" font-family="system-ui, sans-serif">
      Doora Pvt Ltd
    </text>
  </g>

  <!-- 2. Truckit Pvt Ltd -->
  <g transform="translate(248, 412)">
    <g transform="translate(0, -9)">
      <rect x="-21" y="-12" width="42" height="6" rx="3" fill="#1E2A38" />
      <rect x="-21" y="-3" width="42" height="6" rx="3" fill="#DC2626" />
      <rect x="-21" y="6" width="42" height="6" rx="3" fill="#1E2A38" />
      <circle cx="-9" cy="17" r="3" fill="#DC2626" />
      <circle cx="9" cy="17" r="3" fill="#DC2626" />
    </g>
    <text x="0" y="26" text-anchor="middle" fill="#1A2530" font-size="9.5" font-weight="800" font-family="system-ui, sans-serif">
      Truckit Pvt Ltd
    </text>
  </g>

  <!-- 3. Muhib International (MI) -->
  <g transform="translate(356, 412)">
    <g transform="translate(0, -9)">
      <ellipse cx="0" cy="2" rx="21" ry="15" fill="none" stroke="#DC2626" stroke-width="3.2" />
      <path d="M -13,11 L -7,-7 L 0,3 L 7,-7 L 13,11" fill="none" stroke="#1D4ED8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="0" y="26" text-anchor="middle" fill="#1A2530" font-size="8.5" font-weight="800" font-family="system-ui, sans-serif">
      Muhib International SMC Pvt Ltd
    </text>
  </g>

  <!-- 4. Vantage Shipping Line (VLZ) -->
  <g transform="translate(462, 412)">
    <g transform="translate(0, -9)">
      <path d="M -18,9 L 18,9 L 14,16 L -14,16 Z" fill="#F59E0B" />
      <path d="M -12,8 L -12,-3 L 3,-3 L 3,8 Z" fill="#0284C7" />
      <path d="M 5,8 L 5,-9 L 11,-9 L 11,8 Z" fill="#06B6D4" />
      <circle cx="-3" cy="-6" r="2.2" fill="#E0F2FE" />
      <path d="M -22,18 C -14,21 0,16 6,19 C 12,16 20,21 24,19" stroke="#0284C7" stroke-width="2" fill="none" stroke-linecap="round" />
    </g>
    <text x="0" y="26" text-anchor="middle" fill="#1A2530" font-size="8.5" font-weight="800" font-family="system-ui, sans-serif">
      Vantage Shipping Line
    </text>
  </g>
</svg>
